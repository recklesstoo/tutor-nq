name: Actualizar datos de Yahoo

on:
  schedule:
    # GitHub se salta muchas corridas programadas, así que se pide cada 15 minutos para que siempre entre alguna.
    - cron: "7,22,37,52 * * * 1-5"   # lunes a viernes, hora UTC
    - cron: "7,37 23 * * 0"          # domingo en la noche: apertura de la sesión en Nueva York
  workflow_dispatch:          # botón "Run workflow" para correrla a mano

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar yfinance
        run: pip install --quiet yfinance
      - name: Descargar y mezclar velas de 1 minuto
        run: python scripts/update_data.py
      - name: Guardar los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Datos de Yahoo $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
