name: Actualizar datos de Yahoo

on:
  schedule:
    - cron: "23 * * * 1-5"   # cada hora, de lunes a viernes (hora UTC; el lunes 00:23 UTC ya es la apertura del domingo en Nueva York)
  workflow_dispatch:          # botón "Run workflow" para correrla a mano

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar yfinance
        run: pip install --quiet yfinance
      - name: Descargar y mezclar velas de 1 minuto
        run: python scripts/update_data.py
      - name: Guardar los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Datos de Yahoo $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
